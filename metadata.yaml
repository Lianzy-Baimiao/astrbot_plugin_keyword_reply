name: astrbot_plugin_keyword_reply
display_name: 关键字回复
desc: 关键字自动回复插件：一条规则四个字段（关键字、匹配类型、回复、格式），带 Web 面板可视化管理。匹配类型支持精准/模糊/前缀/后缀/正则，回复格式支持纯文本和 MD 格式（自动渲染成图片）。规则分全局与按会话两级，面板里可以按群名选群（不用记群号），也可在聊天里用 /关键字 命令管理。
short_desc: 关键字自动回复（带 Web 面板）
version: v1.0.4
author: lianzy
repo: https://github.com/Lianzy-Baimiao/astrbot_plugin_keyword_reply
# 插件 WebUI 自定义页面（Plugin Pages）能力在 AstrBot v4.24.1 正式引入
astrbot_version: ">=4.24.1"
