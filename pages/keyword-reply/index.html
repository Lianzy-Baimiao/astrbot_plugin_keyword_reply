<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>关键字回复</title>
<!--
  显式声明桥接 SDK：AstrBot 会把这个 src 重写成带 asset_token 的真实地址。
  放在 head 里（不 defer）保证 window.AstrBotPluginPage 在下面的脚本前就绪。
  注意：AstrBot 用「HTML 里是否已含这个 src」来决定要不要自动注入桥接，
  所以整个页面里除了这一处，任何地方都不要再出现那个脚本地址（连注释都不行）。
-->
<script src="/api/plugin/page/bridge-sdk.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>关键字回复</h1>
    <span id="statusPill" class="pill">加载中</span>
    <div class="spacer"></div>
    <button id="btnTest">试一句话</button>
    <button id="btnExport">导出</button>
    <button id="btnImport">导入</button>
    <button id="btnNew" class="primary">新增规则</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="scopeSel">生效范围</label>
        <select id="scopeSel"></select>
      </div>
      <button id="btnPick">选择群…</button>
      <div class="field grow">
        <label for="searchBox">搜索关键字或回复内容</label>
        <input type="text" id="searchBox" placeholder="输入后自动过滤">
      </div>
      <button id="btnReload">刷新</button>
      <button id="btnClear" class="danger">清空本范围</button>
    </div>
    <p class="hint" style="margin:10px 0 0">
      全局规则对所有会话生效；选中某个会话时，该会话的规则会盖掉同名的全局规则。
      下拉里只列有规则或说过话的会话，点「选择群…」可以按群名搜索机器人所在的全部群。
    </p>
  </div>

  <div class="card" style="padding:0;overflow:hidden">
    <table>
      <thead>
        <tr>
          <th style="width:22%">关键字</th>
          <th style="width:88px">匹配类型</th>
          <th>回复</th>
          <th style="width:78px">格式</th>
          <th class="hide-sm" style="width:62px">优先级</th>
          <th class="hide-sm" style="width:62px">命中</th>
          <th style="width:150px"></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="7" class="empty">加载中…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 新增 / 编辑 -->
<div class="modal-mask" id="editMask" hidden>
  <div class="modal">
    <h2 id="editTitle">新增规则</h2>
    <div class="row">
      <div class="field grow">
        <label for="fKeyword">关键字</label>
        <input type="text" id="fKeyword" placeholder="例：活动地址">
      </div>
      <div class="field">
        <label for="fMatch">匹配类型</label>
        <select id="fMatch"></select>
      </div>
      <div class="field">
        <label for="fFormat">格式</label>
        <select id="fFormat"></select>
      </div>
    </div>
    <div class="row">
      <div class="field grow">
        <label for="fReply">回复</label>
        <textarea id="fReply" placeholder="例：一个活动地址"></textarea>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="fPriority">优先级</label>
        <input type="text" id="fPriority" value="0" style="width:90px">
      </div>
      <div class="field">
        <label for="fEnabled">状态</label>
        <select id="fEnabled">
          <option value="1">启用</option>
          <option value="0">停用</option>
        </select>
      </div>
      <div class="field grow">
        <p class="hint" style="margin:0">
          占位符：<code>{sender}</code> <code>{group}</code> <code>{keyword}</code>
          <code>{date}</code> <code>{time}</code> <code>{datetime}</code><br>
          多条命中时：精准 &gt; 前缀/后缀 &gt; 正则 &gt; 模糊，优先级数字大的先赢。
        </p>
      </div>
    </div>
    <div class="modal-foot">
      <button id="editCancel">取消</button>
      <button id="editSave" class="primary">保存</button>
    </div>
  </div>
</div>

<!-- 选择群 -->
<div class="modal-mask" id="pickMask" hidden>
  <div class="modal">
    <h2>按群名选择生效范围</h2>
    <div class="row">
      <div class="field grow">
        <label for="pickSearch">搜索群名 / 群号</label>
        <input type="text" id="pickSearch" placeholder="例：魔兽 或 339466990">
      </div>
      <button id="btnPickRefresh">刷新群列表</button>
    </div>
    <div class="pick-list" id="pickList"></div>
    <div class="modal-foot">
      <span class="hint" id="pickHint" style="margin-right:auto"></span>
      <button id="pickClose">关闭</button>
    </div>
  </div>
</div>

<!-- 试一句话 -->
<div class="modal-mask" id="testMask" hidden>
  <div class="modal">
    <h2>试一句话看命中哪条</h2>
    <div class="row">
      <div class="field grow">
        <label for="tText">消息内容</label>
        <input type="text" id="tText" placeholder="例：活动地址">
      </div>
      <button id="tRun" class="primary">测试</button>
    </div>
    <div id="tResult"></div>
    <div class="modal-foot">
      <button id="testClose">关闭</button>
    </div>
  </div>
</div>

<!-- 导入 -->
<div class="modal-mask" id="importMask" hidden>
  <div class="modal">
    <h2>导入规则</h2>
    <div class="row">
      <div class="field grow">
        <label for="iText">粘贴导出的 JSON（规则数组，或含 rules 数组的对象）</label>
        <textarea id="iText" style="min-height:180px" placeholder='[{"keyword":"活动地址","match":"exact","reply":"一个活动地址","format":"markdown"}]'></textarea>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="iReplace">导入方式</label>
        <select id="iReplace">
          <option value="0">合并（同关键字覆盖）</option>
          <option value="1">先清空本范围再导入</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button id="importCancel">取消</button>
      <button id="importRun" class="primary">开始导入</button>
    </div>
  </div>
</div>

<div id="toast"></div>
<div class="modal-mask" id="modalMask" hidden>
  <div class="modal">
    <h2 id="modalTitle"></h2>
    <p id="modalMsg" style="white-space:pre-line;color:var(--muted,#9aa)"></p>
    <input id="modalInput" type="text" hidden
      style="width:100%;box-sizing:border-box;padding:6px 8px;margin-top:6px">
    <div class="modal-foot">
      <button class="primary" id="modalOk">确定</button>
      <button id="modalCancel">取消</button>
    </div>
  </div>
</div>

<script src="./shell.js"></script>
<script src="./app.js"></script>
</body>
</html>
