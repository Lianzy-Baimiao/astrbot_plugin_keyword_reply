<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>关键字回复</title>
<!--
  显式声明桥接 SDK：AstrBot 会把这个 src 重写成带 asset_token 的真实地址。
  放在 head 里（不 defer）保证 window.AstrBotPluginPage 在下面的脚本前就绪。
  注意：AstrBot 用「HTML 里是否已含这个 src」来决定要不要自动注入桥接，
  所以整个页面里除了这一处，任何地方都不要再出现那个脚本地址（连注释都不行）。
-->
<script src="/api/plugin/page/bridge-sdk.js"></script>
<style>
:root {
  --bg: #f5f7fa;
  --card: #ffffff;
  --border: #e5e7eb;
  --text: #1f2937;
  --text2: #6b7280;
  --text3: #9ca3af;
  --accent: #3b82f6;
  --accent-soft: rgba(59, 130, 246, 0.1);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.1);
  --ok: #22c55e;
  --ok-soft: rgba(34, 197, 94, 0.12);
  --warn: #f59e0b;
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
  --radius: 10px;
}
html[data-theme="dark"] {
  --bg: #17181c;
  --card: #1f2126;
  --border: #32353c;
  --text: #e5e7eb;
  --text2: #9ca3af;
  --text3: #6b7280;
  --accent: #60a5fa;
  --accent-soft: rgba(96, 165, 250, 0.14);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.14);
  --ok: #4ade80;
  --ok-soft: rgba(74, 222, 128, 0.14);
  --warn: #fbbf24;
  --shadow: none;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
    "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
}
.wrap { max-width: 1180px; margin: 0 auto; }

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.topbar h1 { font-size: 18px; margin: 0; font-weight: 600; }
.pill {
  font-size: 12px; padding: 2px 8px; border-radius: 999px;
  background: var(--ok-soft); color: var(--ok);
}
.pill.off { background: var(--danger-soft); color: var(--danger); }
.spacer { flex: 1 1 auto; }

/* ---------- 统计 ---------- */
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.stat {
  flex: 1 1 120px; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 14px; box-shadow: var(--shadow);
}
.stat .n { font-size: 20px; font-weight: 600; }
.stat .l { font-size: 12px; color: var(--text2); }

/* ---------- 控件 ---------- */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px; margin-bottom: 14px;
}
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.grow { flex: 1 1 200px; min-width: 0; }
label { font-size: 12px; color: var(--text2); }
input[type="text"], select, textarea {
  font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px;
  width: 100%; outline: none;
}
input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 92px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
button {
  font: inherit; cursor: pointer; border-radius: 8px; padding: 7px 14px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  white-space: nowrap;
}
button:hover { border-color: var(--accent); color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover { opacity: .9; color: #fff; }
button.danger { color: var(--danger); border-color: var(--danger); }
button.danger:hover { background: var(--danger-soft); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.link {
  border: none; background: none; padding: 2px 6px; color: var(--text2);
  font-size: 13px;
}
button.link:hover { color: var(--accent); }
button.link.danger { color: var(--danger); }
.hint { font-size: 12px; color: var(--text3); }
.hint code {
  background: var(--accent-soft); color: var(--accent);
  padding: 1px 5px; border-radius: 4px; font-size: 12px;
}

/* ---------- 表格 ---------- */
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { font-size: 12px; color: var(--text2); font-weight: 500; white-space: nowrap; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--accent-soft); }
tr.off td { opacity: .5; }
.kw { font-weight: 600; word-break: break-all; }
.tag {
  display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent); white-space: nowrap;
}
.tag.md { background: rgba(167, 139, 250, .16); color: #7c3aed; }
html[data-theme="dark"] .tag.md { color: #c4b5fd; }
.reply-cell { max-width: 400px; }
.reply-text {
  white-space: pre-wrap; word-break: break-word; font-size: 13px;
  max-height: 60px; overflow: hidden; position: relative;
}
.reply-text.expanded { max-height: none; }
.acts { white-space: nowrap; text-align: right; }
.empty { text-align: center; color: var(--text3); padding: 30px 10px; }

/* ---------- 弹窗 ---------- */
.modal-mask {
  position: fixed; inset: 0; background: rgba(0, 0, 0, .45);
  display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50;
}
.modal-mask[hidden] { display: none; }
.modal {
  background: var(--card); border-radius: 12px; border: 1px solid var(--border);
  width: 100%; max-width: 620px; max-height: 90vh; overflow: auto; padding: 18px;
}
.modal h2 { margin: 0 0 14px; font-size: 16px; }
.modal .row { margin-bottom: 12px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }

/* ---------- toast ---------- */
#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
  background: var(--text); color: var(--card); padding: 9px 18px; border-radius: 8px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 99;
  max-width: 80vw; text-align: center;
}
#toast.show { opacity: 1; }
#toast.err { background: var(--danger); color: #fff; }

/* ---------- 测试结果 ---------- */
.test-hit {
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; margin-top: 8px;
}
.test-hit.win { border-color: var(--ok); background: var(--ok-soft); }
.test-hit pre {
  margin: 6px 0 0; white-space: pre-wrap; word-break: break-word;
  font-size: 12px; color: var(--text2);
}
@media (max-width: 720px) {
  th.hide-sm, td.hide-sm { display: none; }
  .reply-cell { max-width: 160px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>关键字回复</h1>
    <span id="statusPill" class="pill">加载中</span>
    <div class="spacer"></div>
    <button id="btnTest">试一句话</button>
    <button id="btnExport">导出</button>
    <button id="btnImport">导入</button>
    <button id="btnNew" class="primary">新增规则</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="card">
    <div class="row">
      <div class="field">
        <label for="scopeSel">生效范围</label>
        <select id="scopeSel"></select>
      </div>
      <div class="field grow">
        <label for="searchBox">搜索关键字或回复内容</label>
        <input type="text" id="searchBox" placeholder="输入后自动过滤">
      </div>
      <button id="btnReload">刷新</button>
      <button id="btnClear" class="danger">清空本范围</button>
    </div>
    <p class="hint" style="margin:10px 0 0">
      全局规则对所有会话生效；选中某个会话时，该会话的规则会盖掉同名的全局规则。
    </p>
  </div>

  <div class="card" style="padding:0;overflow:hidden">
    <table>
      <thead>
        <tr>
          <th style="width:22%">关键字</th>
          <th style="width:88px">匹配类型</th>
          <th>回复</th>
          <th style="width:78px">格式</th>
          <th class="hide-sm" style="width:62px">优先级</th>
          <th class="hide-sm" style="width:62px">命中</th>
          <th style="width:150px"></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="7" class="empty">加载中…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- 新增 / 编辑 -->
<div class="modal-mask" id="editMask" hidden>
  <div class="modal">
    <h2 id="editTitle">新增规则</h2>
    <div class="row">
      <div class="field grow">
        <label for="fKeyword">关键字</label>
        <input type="text" id="fKeyword" placeholder="例：活动地址">
      </div>
      <div class="field">
        <label for="fMatch">匹配类型</label>
        <select id="fMatch"></select>
      </div>
      <div class="field">
        <label for="fFormat">格式</label>
        <select id="fFormat"></select>
      </div>
    </div>
    <div class="row">
      <div class="field grow">
        <label for="fReply">回复</label>
        <textarea id="fReply" placeholder="例：一个活动地址"></textarea>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="fPriority">优先级</label>
        <input type="text" id="fPriority" value="0" style="width:90px">
      </div>
      <div class="field">
        <label for="fEnabled">状态</label>
        <select id="fEnabled">
          <option value="1">启用</option>
          <option value="0">停用</option>
        </select>
      </div>
      <div class="field grow">
        <p class="hint" style="margin:0">
          占位符：<code>{sender}</code> <code>{group}</code> <code>{keyword}</code>
          <code>{date}</code> <code>{time}</code> <code>{datetime}</code><br>
          多条命中时：精准 &gt; 前缀/后缀 &gt; 正则 &gt; 模糊，优先级数字大的先赢。
        </p>
      </div>
    </div>
    <div class="modal-foot">
      <button id="editCancel">取消</button>
      <button id="editSave" class="primary">保存</button>
    </div>
  </div>
</div>

<!-- 试一句话 -->
<div class="modal-mask" id="testMask" hidden>
  <div class="modal">
    <h2>试一句话看命中哪条</h2>
    <div class="row">
      <div class="field grow">
        <label for="tText">消息内容</label>
        <input type="text" id="tText" placeholder="例：活动地址">
      </div>
      <button id="tRun" class="primary">测试</button>
    </div>
    <div id="tResult"></div>
    <div class="modal-foot">
      <button id="testClose">关闭</button>
    </div>
  </div>
</div>

<!-- 导入 -->
<div class="modal-mask" id="importMask" hidden>
  <div class="modal">
    <h2>导入规则</h2>
    <div class="row">
      <div class="field grow">
        <label for="iText">粘贴导出的 JSON（规则数组，或含 rules 数组的对象）</label>
        <textarea id="iText" style="min-height:180px" placeholder='[{"keyword":"活动地址","match":"exact","reply":"一个活动地址","format":"markdown"}]'></textarea>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="iReplace">导入方式</label>
        <select id="iReplace">
          <option value="0">合并（同关键字覆盖）</option>
          <option value="1">先清空本范围再导入</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button id="importCancel">取消</button>
      <button id="importRun" class="primary">开始导入</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  // 桥接 SDK 已在 <head> 里显式引入（见页面顶部），执行到这里时 window.AstrBotPluginPage
  // 通常已就位；页面跑在 iframe 里，还要等它和父窗口 ready() 握手完才算真正可用。
  // 保险起见下面仍用 waitForBridge 轮询，不在脚本顶部就把它抓进变量。

  var state = {
    scope: "global",
    rules: [],
    meta: { match_types: [], formats: [] },
    editing: null
  };

  // ---------- 小工具 ----------

  function byId(id) { return document.getElementById(id); }

  var toastTimer = null;
  function toast(msg, isErr) {
    var el = byId("toast");
    el.textContent = String(msg || "");
    el.className = "show" + (isErr ? " err" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = ""; }, 2600);
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // 后端统一返回 {status, message, data}；status 不是 ok 就抛出 message。
  function unwrap(resp) {
    if (resp && typeof resp === "object" && "status" in resp) {
      if (String(resp.status).toLowerCase() !== "ok") {
        throw new Error(resp.message || "请求失败");
      }
      return resp.data || {};
    }
    return resp || {};
  }

  // 轮询等待桥接脚本加载并完成 ready 握手；超时就抛出可读错误。
  var _bridgeReady = null;
  function waitForBridge(timeoutMs) {
    if (_bridgeReady) return _bridgeReady;
    var deadline = Date.now() + (timeoutMs || 8000);
    _bridgeReady = new Promise(function (resolve, reject) {
      (function poll() {
        var bridge = window.AstrBotPluginPage;
        if (bridge) {
          var done = function () { resolve(bridge); };
          if (typeof bridge.ready === "function") {
            // ready() 等父窗口回握手；万一父窗口不回也别把面板卡死
            Promise.resolve(bridge.ready()).then(done, done);
          } else {
            done();
          }
          return;
        }
        if (Date.now() > deadline) {
          _bridgeReady = null;
          reject(new Error("面板桥接不可用，请在 AstrBot WebUI 里打开本页面"));
          return;
        }
        setTimeout(poll, 32);
      })();
    });
    return _bridgeReady;
  }

  function apiGet(path, params) {
    return waitForBridge().then(function (bridge) {
      return bridge.apiGet(path, params || {}).then(unwrap);
    });
  }

  // 桥接只有 apiGet / apiPost，PUT / DELETE 靠 body 里的 _method 透传。
  function apiPost(path, body) {
    return waitForBridge().then(function (bridge) {
      return bridge.apiPost(path, body || {}).then(unwrap);
    });
  }

  function fail(err) {
    toast((err && err.message) || "操作失败", true);
  }

  // 跟随 WebUI 的明暗主题
  function initTheme() {
    var params = new URLSearchParams(window.location.search);
    var v = params.get("theme");
    var dark = v === "dark" || params.get("isDark") === "true";
    if (!v && params.get("isDark") === null) {
      try {
        dark = localStorage.getItem("astrbot_plugin_theme_is_dark") === "true";
      } catch (e) { /* 忽略：localStorage 被禁用时用亮色 */ }
    }
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }

  // ---------- 渲染 ----------

  function fillSelect(sel, items, value) {
    sel.innerHTML = items.map(function (it) {
      return '<option value="' + esc(it.value) + '">' + esc(it.label) + "</option>";
    }).join("");
    if (value != null) sel.value = value;
  }

  function renderStats(st, enabled) {
    var pill = byId("statusPill");
    pill.textContent = enabled ? "自动回复已开启" : "自动回复已关闭";
    pill.className = "pill" + (enabled ? "" : " off");
    byId("stats").innerHTML = [
      ['<div class="stat"><div class="n">', st.total || 0, '</div><div class="l">本范围规则</div></div>'],
      ['<div class="stat"><div class="n">', st.enabled || 0, '</div><div class="l">启用中</div></div>'],
      ['<div class="stat"><div class="n">', st.disabled || 0, '</div><div class="l">已停用</div></div>'],
      ['<div class="stat"><div class="n">', st.hits || 0, '</div><div class="l">累计命中</div></div>']
    ].map(function (p) { return p.join(""); }).join("");
  }

  function renderRows() {
    var kw = byId("searchBox").value.trim().toLowerCase();
    var rows = state.rules.filter(function (r) {
      if (!kw) return true;
      return String(r.keyword).toLowerCase().indexOf(kw) >= 0 ||
        String(r.reply).toLowerCase().indexOf(kw) >= 0;
    });
    var tb = byId("tbody");
    if (!rows.length) {
      tb.innerHTML = '<tr><td colspan="7" class="empty">' +
        (state.rules.length ? "没有匹配的规则" : "还没有规则，点右上角「新增规则」") +
        "</td></tr>";
      return;
    }
    tb.innerHTML = rows.map(function (r) {
      var isMd = r.format === "markdown";
      return '<tr class="' + (r.enabled ? "" : "off") + '">' +
        '<td class="kw">' + esc(r.keyword) + "</td>" +
        '<td><span class="tag">' + esc(r.match_label) + "</span></td>" +
        '<td class="reply-cell"><div class="reply-text" data-act="expand">' + esc(r.reply) + "</div></td>" +
        '<td><span class="tag' + (isMd ? " md" : "") + '">' + esc(r.format_label) + "</span></td>" +
        '<td class="hide-sm">' + esc(r.priority || 0) + "</td>" +
        '<td class="hide-sm">' + esc(r.hits || 0) + "</td>" +
        '<td class="acts">' +
          '<button class="link" data-act="edit" data-id="' + esc(r.id) + '">编辑</button>' +
          '<button class="link" data-act="toggle" data-id="' + esc(r.id) + '">' +
            (r.enabled ? "停用" : "启用") + "</button>" +
          '<button class="link danger" data-act="del" data-id="' + esc(r.id) + '">删除</button>' +
        "</td></tr>";
    }).join("");
  }

  // ---------- 数据加载 ----------

  function loadMeta() {
    return apiGet("page/meta").then(function (d) {
      state.meta = d;
      fillSelect(byId("fMatch"), d.match_types || []);
      fillSelect(byId("fFormat"), d.formats || []);
    });
  }

  function loadRules() {
    return apiGet("page/rules", { scope: state.scope }).then(function (d) {
      state.rules = d.rules || [];
      state.scope = d.scope || state.scope;
      fillSelect(byId("scopeSel"), (d.scopes || []).map(function (s) {
        return { value: s.value, label: s.label + "（" + s.count + "）" };
      }), state.scope);
      renderStats(d.stats || {}, d.enabled !== false);
      renderRows();
    });
  }

  // ---------- 编辑弹窗 ----------

  function openEdit(rule) {
    state.editing = rule || null;
    byId("editTitle").textContent = rule ? "编辑规则" : "新增规则";
    byId("fKeyword").value = rule ? rule.keyword : "";
    byId("fMatch").value = rule ? rule.match : "exact";
    byId("fFormat").value = rule ? rule.format : "text";
    byId("fReply").value = rule ? rule.reply : "";
    byId("fPriority").value = rule ? (rule.priority || 0) : 0;
    byId("fEnabled").value = rule && !rule.enabled ? "0" : "1";
    byId("editMask").hidden = false;
    byId("fKeyword").focus();
  }

  function saveEdit() {
    var payload = {
      scope: state.scope,
      keyword: byId("fKeyword").value.trim(),
      match: byId("fMatch").value,
      reply: byId("fReply").value,
      format: byId("fFormat").value,
      priority: byId("fPriority").value.trim() || "0",
      enabled: byId("fEnabled").value === "1"
    };
    if (!payload.keyword) { toast("关键字不能为空", true); return; }
    if (!payload.reply.trim()) { toast("回复内容不能为空", true); return; }

    var btn = byId("editSave");
    btn.disabled = true;
    var req;
    if (state.editing) {
      payload.id = state.editing.id;
      payload._method = "PUT";
      req = apiPost("page/rules", payload);
    } else {
      req = apiPost("page/rules", payload).catch(function (err) {
        // 后端把「同关键字 + 同匹配类型」判重了，问一下要不要覆盖
        if (!/已存在同样的规则/.test(err.message || "")) throw err;
        if (!window.confirm(err.message + "\n\n覆盖掉原来那条？")) throw new Error("已取消");
        payload.overwrite = true;
        return apiPost("page/rules", payload);
      });
    }
    req.then(function () {
      byId("editMask").hidden = true;
      toast(state.editing ? "已更新" : "已保存");
      return loadRules();
    }).catch(function (err) {
      if ((err && err.message) !== "已取消") fail(err);
    }).then(function () { btn.disabled = false; });
  }

  // ---------- 行内操作 ----------

  function onTableClick(ev) {
    var target = ev.target;
    var act = target.getAttribute && target.getAttribute("data-act");
    if (!act) return;
    if (act === "expand") { target.classList.toggle("expanded"); return; }

    var id = target.getAttribute("data-id");
    var rule = state.rules.filter(function (r) { return r.id === id; })[0];
    if (!rule) return;

    if (act === "edit") { openEdit(rule); return; }
    if (act === "toggle") {
      apiPost("page/rules/toggle", { scope: state.scope, id: id })
        .then(function () { return loadRules(); })
        .catch(fail);
      return;
    }
    if (act === "del") {
      if (!window.confirm("删除规则「" + rule.keyword + "」？")) return;
      apiPost("page/rules", { scope: state.scope, ids: [id], _method: "DELETE" })
        .then(function () { toast("已删除"); return loadRules(); })
        .catch(fail);
    }
  }

  // ---------- 测试 ----------

  function runTest() {
    var text = byId("tText").value.trim();
    if (!text) { toast("请输入要测试的内容", true); return; }
    byId("tResult").innerHTML = '<p class="hint">测试中…</p>';
    apiPost("page/test", { scope: state.scope, text: text }).then(function (d) {
      var hits = d.matches || [];
      if (!hits.length) {
        byId("tResult").innerHTML = '<p class="hint">没有命中任何规则</p>';
        return;
      }
      byId("tResult").innerHTML = hits.map(function (h) {
        return '<div class="test-hit' + (h.would_reply ? " win" : "") + '">' +
          "<b>" + esc(h.keyword) + "</b> " +
          '<span class="tag">' + esc(h.match_label) + "</span> " +
          '<span class="tag' + (h.format === "markdown" ? " md" : "") + '">' +
            esc(h.format_label) + "</span> " +
          (h.would_reply ? '<span class="pill">实际会回这条</span>' : "") +
          (h.enabled ? "" : ' <span class="pill off">已停用</span>') +
          "<pre>" + esc(h.rendered) + "</pre></div>";
      }).join("");
    }).catch(function (err) {
      byId("tResult").innerHTML = "";
      fail(err);
    });
  }

  // ---------- 导入导出 ----------

  function doExport() {
    apiGet("page/export", { scope: state.scope }).then(function (d) {
      var text = JSON.stringify(d, null, 2);
      var blob = new Blob([text], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "keyword_rules_" + state.scope.replace(/[^\w.-]+/g, "_") + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
      toast("已导出 " + ((d.rules || []).length) + " 条");
    }).catch(fail);
  }

  function doImport() {
    var raw = byId("iText").value.trim();
    if (!raw) { toast("请先粘贴 JSON", true); return; }
    var btn = byId("importRun");
    btn.disabled = true;
    apiPost("page/import", {
      scope: state.scope,
      rules: raw,
      replace: byId("iReplace").value === "1"
    }).then(function (d) {
      byId("importMask").hidden = true;
      byId("iText").value = "";
      toast("新增 " + d.added + " 条，覆盖 " + d.updated + " 条" +
        (d.failed && d.failed.length ? "，跳过 " + d.failed.length + " 条" : ""));
      return loadRules();
    }).catch(fail).then(function () { btn.disabled = false; });
  }

  // ---------- 绑定 ----------

  function bind() {
    byId("tbody").addEventListener("click", onTableClick);
    byId("searchBox").addEventListener("input", renderRows);
    byId("scopeSel").addEventListener("change", function () {
      state.scope = this.value;
      loadRules().catch(fail);
    });
    byId("btnReload").addEventListener("click", function () {
      loadRules().then(function () { toast("已刷新"); }).catch(fail);
    });
    byId("btnNew").addEventListener("click", function () { openEdit(null); });
    byId("editCancel").addEventListener("click", function () { byId("editMask").hidden = true; });
    byId("editSave").addEventListener("click", saveEdit);

    byId("btnTest").addEventListener("click", function () {
      byId("tResult").innerHTML = "";
      byId("testMask").hidden = false;
      byId("tText").focus();
    });
    byId("tRun").addEventListener("click", runTest);
    byId("tText").addEventListener("keydown", function (e) {
      if (e.key === "Enter") runTest();
    });
    byId("testClose").addEventListener("click", function () { byId("testMask").hidden = true; });

    byId("btnExport").addEventListener("click", doExport);
    byId("btnImport").addEventListener("click", function () { byId("importMask").hidden = false; });
    byId("importCancel").addEventListener("click", function () { byId("importMask").hidden = true; });
    byId("importRun").addEventListener("click", doImport);

    byId("btnClear").addEventListener("click", function () {
      var label = byId("scopeSel").selectedOptions[0];
      if (!window.confirm("清空「" + (label ? label.textContent : state.scope) +
        "」下的所有规则？此操作不可撤销。")) return;
      apiPost("page/rules/clear", { scope: state.scope, confirm: "1" })
        .then(function (d) { toast("已清空 " + d.cleared + " 条"); return loadRules(); })
        .catch(fail);
    });

    // 点遮罩空白处关闭弹窗
    ["editMask", "testMask", "importMask"].forEach(function (id) {
      byId(id).addEventListener("click", function (e) {
        if (e.target === this) this.hidden = true;
      });
    });
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Escape") return;
      ["editMask", "testMask", "importMask"].forEach(function (id) { byId(id).hidden = true; });
    });
  }

  initTheme();
  bind();
  byId("tbody").innerHTML = '<tr><td colspan="7" class="empty">正在连接面板…</td></tr>';
  waitForBridge()
    .then(loadMeta)
    .then(loadRules)
    .catch(function (err) {
      byId("tbody").innerHTML = '<tr><td colspan="7" class="empty">' +
        esc((err && err.message) || "加载失败") + "</td></tr>";
      fail(err);
    });
})();
</script>
</body>
</html>
